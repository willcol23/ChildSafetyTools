<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Eliminition Safety Suite</title>
    <link rel="stylesheet" href="styles.css" />
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
  </head>
  <body>
    <main class="card">
      <!-- Dashboard View -->
      <section id="home-view" class="view active">
        <h1>Eliminition Suite</h1>
        <p>Your unified safety dashboard.</p>

        <div class="menu-list">
          <button class="menu-button" data-view="profile">
            <span class="title">Identity Vault</span>
            <span class="desc">Secure child profiles</span>
          </button>
          <button class="menu-button" data-view="location">
            <span class="title">Safety Map</span>
            <span class="desc">Regional risk analysis</span>
          </button>
          <button class="menu-button disabled" disabled>
            <span class="title">Messenger</span>
            <span class="desc">Coming Soon</span>
          </button>
          <button class="menu-button disabled" disabled>
            <span class="title">Activity Tracker</span>
            <span class="desc">Coming Soon</span>
          </button>
        </div>
      </section>

      <!-- Identity Vault View -->
      <section id="profile-view" class="view">
        <button class="back-button" type="button" data-view="home">← Back to Dashboard</button>
        <h1>Identity Vault</h1>
        <form id="profile-form" class="profile-form">
          <label>
            <span>Name</span>
            <input type="text" name="name" required />
          </label>
          <label>
            <span>Date of Birth</span>
            <input type="date" name="dob" required />
          </label>
          <label>
            <span>Description</span>
            <textarea name="description" rows="4"></textarea>
          </label>
          <button class="menu-button" type="submit">Save Profile</button>
        </form>
        <p id="form-status" class="status"></p>
        <ul id="profile-list"></ul>
      </section>

      <!-- Safety Map View -->
      <section id="location-view" class="view">
        <button class="back-button" type="button" data-view="home">← Back to Dashboard</button>
        <h1>Location Safety Map</h1>
        <form id="location-form">
          <div class="form-group">
            <input type="text" name="city" placeholder="City (e.g. Columbus)" required />
            <input type="text" name="state" placeholder="State (e.g. OH)" maxlength="2" required />
            <select name="crime_type" aria-label="Crime Type">
              <option value="all" selected>All Crime Types</option>
              <option value="violent">Violent Crime</option>
              <option value="property">Property Crime</option>
            </select>
          </div>
          <button class="menu-button" type="submit">Load Heatmap</button>
        </form>
        <div id="location-status" class="status"></div>
        <div id="map"></div>
      </section>
    </main>

    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>
    <script src="app.js"></script>
    <script type="module">
      import { initLocationSafetyMapModule } from './safetyTools/location-safety-map/index.js';
      initLocationSafetyMapModule();
    </script>
  </body>
</html>
