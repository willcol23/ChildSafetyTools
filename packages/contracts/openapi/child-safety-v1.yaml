openapi: 3.1.0
info:
  title: Child Safety API
  version: 1.0.0
paths:
  /v1/locations:resolve:
    get:
      summary: Resolve a city/state to geographic coordinates
      operationId: resolveLocation
      parameters:
        - $ref: '#/components/parameters/City'
        - $ref: '#/components/parameters/State'
      responses:
        '200':
          description: Resolved location
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResolvedLocation'
  /v1/heatmaps/overlay:
    get:
      summary: Get safety heatmap data for a specific area
      operationId: getHeatmapOverlay
      parameters:
        - $ref: '#/components/parameters/City'
        - $ref: '#/components/parameters/State'
        - name: radius_km
          in: query
          schema: { type: number, minimum: 0.1, default: 8 }
        - name: crime_type
          in: query
          schema: { type: string, default: all }
      responses:
        '200':
          description: Heatmap overlay
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HeatmapOverlay'

  # --- Identity Vault Endpoints ---
  /v1/vault/profiles:
    get:
      summary: List all child profiles in the vault
      operationId: listProfiles
      responses:
        '200':
          description: A list of child profiles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ChildProfile'
    post:
      summary: Create a new child profile in the vault
      operationId: createProfile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChildProfile'
      responses:
        '201':
          description: Profile created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChildProfile'

  /v1/vault/profiles/{profileId}:
    parameters:
      - name: profileId
        in: path
        required: true
        schema: { type: string }
    get:
      summary: Get a specific child profile by ID
      operationId: getProfile
      responses:
        '200':
          description: Child profile details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChildProfile'
        '404':
          description: Profile not found

  /v1/vault/profiles/{profileId}/attachments:
    post:
      summary: Upload an attachment for a child profile
      operationId: uploadAttachment
      parameters:
        - name: profileId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                description:
                  type: string
      responses:
        '201':
          description: Attachment uploaded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Attachment'

  # --- Location Tracker Endpoints ---
  /v1/tracker/events:
    post:
      summary: Report a new location or activity event
      operationId: reportLocationEvent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LocationEvent'
      responses:
        '202':
          description: Event accepted for processing

  # --- Secure Communication Endpoints ---
  /v1/communication/messages:
    post:
      summary: Send an encrypted message
      operationId: sendSecureMessage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SecureMessage'
      responses:
        '200':
          description: Message sent successfully

components:
  parameters:
    City:
      name: city
      in: query
      schema: { type: string, default: Columbus }
    State:
      name: state
      in: query
      schema: { type: string, default: OH }
  schemas:
    Location:
      type: object
      required: [lat, lng]
      properties:
        lat: { type: number }
        lng: { type: number }
    ResolvedLocation:
      type: object
      required: [city, state, location]
      properties:
        city: { type: string }
        state: { type: string }
        location: { $ref: '#/components/schemas/Location' }
    HeatmapCell:
      type: object
      required: [lat, lng, intensity, count, crime_types, properties]
      properties:
        lat: { type: number }
        lng: { type: number }
        intensity: { type: number, minimum: 0, maximum: 1 }
        count: { type: integer, minimum: 0 }
        crime_types:
          type: array
          items: { type: string }
        properties: { type: object, additionalProperties: true }
    HeatmapOverlay:
      type: object
      required: [location, radius_km, filters, cell_count, cells]
      properties:
        location: { $ref: '#/components/schemas/Location' }
        radius_km: { type: number }
        filters: { type: object, additionalProperties: true }
        cell_count: { type: integer }
        cells:
          type: array
          items: { $ref: '#/components/schemas/HeatmapCell' }

    # --- New Schemas for Consistently Platform-Agnostic Models ---
    Attachment:
      type: object
      required: [id, name, content_type]
      properties:
        id: { type: string }
        name: { type: string }
        content_type: { type: string }
        url: { type: string, format: uri }

    ChildProfile:
      type: object
      required: [name, dob]
      properties:
        id: { type: string }
        name: { type: string }
        dob: { type: string, format: date }
        description: { type: string }
        attachments:
          type: array
          items: { $ref: '#/components/schemas/Attachment' }
        metadata: { type: object, additionalProperties: true }

    LocationEvent:
      type: object
      required: [profileId, location, timestamp]
      properties:
        profileId: { type: string }
        location: { $ref: '#/components/schemas/Location' }
        timestamp: { type: string, format: date-time }
        activity_type: { type: string, enum: [stationary, walking, running, driving, unknown] }
        battery_level: { type: number, minimum: 0, maximum: 100 }

    SecureMessage:
      type: object
      required: [senderId, recipientId, encryptedPayload]
      properties:
        senderId: { type: string }
        recipientId: { type: string }
        encryptedPayload: { type: string, description: "Base64 encoded encrypted message" }
        isSilent: { type: boolean, default: false }
